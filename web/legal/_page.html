@media (prefers-color-scheme: dark){:root{--bg:#121316;--panel:#1b1d21;--line:#2a2c32;--text:#ecebe8;--muted:#a3a29d;--accent:#ff7a2e;--grad:linear-gradient(135deg,#ff9a3c,#ff5f1a)}}

.date{color:var(--muted);font-size:15px;margin:0 0 28px}

.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 18px;color:var(--muted);font-size:15px}
footer{max-width:820px;margin:0 auto;padding:0 22px 48px;color:var(--muted);font-size:14px;line-height:2}
footer a{color:var(--muted)}
